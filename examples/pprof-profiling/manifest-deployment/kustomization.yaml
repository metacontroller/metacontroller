# Same as ../manifest, but for a metacontroller deployed as a Deployment.
resources:
- ../../../manifests/dev-deployment
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: metacontroller
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/args
      value:
      - --zap-devel
      - --zap-log-level=5
      - --discovery-interval=5s
      - --pprof-address=:6060
